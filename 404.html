<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 // Sector Not Found — Arka Datta</title>
  <meta name="description" content="404 Error — Requested telemetry coordinates not found on this server sector.">
  <link rel="icon" type="image/png" href="logo/favicon.png">

  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem('arka_portfolio_theme');
        if (savedTheme) {
          document.documentElement.setAttribute('data-theme', savedTheme);
        }
      } catch (_) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cursor.css">

  <style>
    :root, html[data-theme="cyan"] {
      --bg: #0a0a0a;
      --text: #f0ede8;
      --accent: #00f0ff;
      --accent-glow: rgba(0, 240, 255, 0.4);
      --accent-dim: rgba(0, 240, 255, 0.12);
      --line: rgba(255, 255, 255, 0.12);
    }
    html[data-theme="amber"] {
      --accent: #ffb000;
      --accent-glow: rgba(255, 176, 0, 0.45);
      --accent-dim: rgba(255, 176, 0, 0.12);
    }
    html[data-theme="green"] {
      --accent: #00ff66;
      --accent-glow: rgba(0, 255, 102, 0.45);
      --accent-dim: rgba(0, 255, 102, 0.12);
    }
    html[data-theme="mono"] {
      --accent: #ffffff;
      --accent-glow: rgba(255, 255, 255, 0.4);
      --accent-dim: rgba(255, 255, 255, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, var(--line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--line) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.35;
      pointer-events: none;
    }
    .hud-box {
      position: relative;
      z-index: 2;
      max-width: 600px;
      width: 100%;
      background: rgba(17, 17, 17, 0.85);
      border: 1px solid var(--accent);
      box-shadow: 0 0 30px var(--accent-glow);
      padding: 3rem 2rem;
      border-radius: 4px;
    }
    .hud-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      font-family: monospace;
      letter-spacing: 2px;
      color: var(--accent);
      border: 1px solid var(--accent);
      background: var(--accent-dim);
      padding: 0.3rem 0.8rem;
      border-radius: 2px;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }
    .hud-status-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    h1 {
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      color: var(--text);
      margin-bottom: 0.5rem;
    }
    .sub-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    p {
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: #999;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .hud-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-decoration: none;
      padding: 0.75rem 1.4rem;
      border-radius: 2px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .hud-btn.primary {
      background: var(--accent);
      color: #000;
      border: 1px solid var(--accent);
    }
    .hud-btn.primary:hover {
      box-shadow: 0 0 16px var(--accent);
      transform: translateY(-1px);
    }
    .hud-btn.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }
    .hud-btn.secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="cursor-dot"></div>
  <div class="cursor-outline"></div>
  <script src="cursor.js" defer></script>

  <div class="grid-overlay" aria-hidden="true"></div>

  <main class="hud-box" role="main">
    <div class="hud-status-badge">SYS.ERR // 0x404</div>
    <h1>404</h1>
    <div class="sub-title">SECTOR TELEMETRY LOST</div>
    <p>
      The navigational coordinates you attempted to probe do not exist or have been de-orbited from the server cluster.
    </p>
    <div class="actions">
      <a href="index.html" class="hud-btn primary" aria-label="Return to portfolio home">
        <span>&larr;</span> Return to Base
      </a>
      <a href="contact.html" class="hud-btn secondary" aria-label="Contact Arka Datta">
        Send Signal
      </a>
    </div>
  </main>
</body>
</html>
